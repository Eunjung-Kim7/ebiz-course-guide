<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}

.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13.5px;margin-top:8px}

.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tcard{text-align:left;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit}
.tcard b{display:block;font-size:15px}.tcard small{color:var(--muted);font-size:12.5px;display:block;line-height:1.5}

label.f{display:block;font-weight:800;font-size:14px;margin:12px 0 4px}

input[type=text],textarea,select{width:100%;font:inherit;font-size:15px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}

.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}

.okline{color:var(--ok);font-weight:700;font-size:14px}.warnline{color:var(--warn);font-weight:700;font-size:14px}.badline{color:var(--bad);font-weight:700;font-size:14px}
.note{font-size:13.5px;background:var(--tint);border-radius:8px;padding:8px 10px}
.check{padding-left:4px;list-style:none;margin:6px 0}.check li{margin:4px 0}
.tw{overflow-x:auto}

.prev{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:14px}
.prev b{color:var(--navy)}
.hide{display:none!important}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:8px 0}.cc{border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:8px;padding:8px 10px;font-size:13px;background:var(--card)}.cc b{font-size:14px}.cc ol{margin:4px 0 0 16px;padding:0}.cc li{margin:2px 0}
.ffg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}.ffb{border:1.5px solid var(--line);border-radius:10px;padding:8px;font-size:12.5px;min-height:84px;color:#1d2433;box-shadow:0 2px 4px rgba(0,0,0,.08)}.ffb b{font-size:13px}.fflv{display:inline-block;background:#1b2a4a;color:#fff;border-radius:999px;padding:0 7px;font-size:11px;margin-left:4px}.ffw{margin-top:4px}.ffy{margin-top:3px;font-size:11.5px;color:#5d6679}

.vcw{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--soft);margin:8px 0}.vcs{display:grid;grid-template-columns:1fr;gap:4px;margin-bottom:6px}.vcsb{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12.5px;cursor:pointer}
.vcp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.vcpb{background:var(--card);border:1px solid var(--line);padding:8px 14px 8px 8px;font-size:12.5px;cursor:pointer;clip-path:polygon(0 0,88% 0,100% 50%,88% 100%,0 100%);min-height:62px}.vcpb span{font-size:11px;color:var(--muted)}
.vcsb.on,.vcpb.on{background:#b98a3d;color:#1b2a4a;border-color:#b98a3d}.vcpb.on span{color:#1b2a4a}.vcm{text-align:right;font-size:12px;color:var(--muted);margin-top:4px}
@media (max-width:640px){.vcp{grid-template-columns:1fr}.vcpb{clip-path:none}}
.board{overflow-x:auto;padding:4px 0 8px}.bleg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.bleg .stk{margin:0;transform:none;font-size:11.5px;padding:2px 8px}
.bd5{display:grid;gap:8px;min-width:0}.bcol{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px;min-height:140px}.bcol.core{outline:3px solid var(--gold);background:var(--tint)}.bcol.weak{outline:2px dashed var(--warn)}
.bh{font-size:13px;line-height:1.35;padding:2px 2px 6px;border-bottom:1px dashed var(--line);margin-bottom:4px}.bh span{font-size:11.5px;color:var(--muted)}.bh em{display:block;font-style:normal;font-weight:800;color:var(--gold);font-size:12px}.bh em.wk{color:var(--warn)}
.stk{border-radius:3px;padding:6px 8px;font-size:12.5px;line-height:1.45;margin:7px 2px;box-shadow:0 2px 5px rgba(0,0,0,.18);color:#1d2433;transform:rotate(-1deg)}.stk:nth-child(even){transform:rotate(1deg)}
.stk.y{background:#fff1a8}.stk.p{background:#ffd3de}.stk.b{background:#cfe6ff}.stk.g{background:#d3f4cc}.stk.w{background:#fff;border:1.5px dashed #b98a3d}.stk.o{background:#ffe0b8}.stk.v{background:#e6dcff}
.bempty{font-size:12px;color:var(--muted);text-align:center;padding:16px 0}
.draft{display:inline-block;background:var(--gold);color:#1b1306;font-size:11px;font-weight:800;padding:1px 8px;border-radius:6px}
.hl{color:var(--warn,#a3621b)}
.concept{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:12px 14px;background:var(--tint,#f6efe1);border-left:4px solid var(--gold,#b98a3d);border-radius:8px;margin:10px 0 0;font-size:15px;line-height:1.75}

.whyline{font-size:14px;background:var(--bg);border-radius:8px;padding:8px 10px;margin:8px 0}.whyline b{color:var(--gold,#b98a3d)}
details.stuck{margin-top:10px}details.stuck>summary{cursor:pointer;font-size:14px;color:var(--warn,#a3621b);font-weight:700}details.stuck ul{margin:6px 0 0;padding-left:1.3rem;font-size:14px;line-height:1.75}
.rub{font-size:14px;margin-top:8px;padding:8px 10px;border:1px dashed var(--gold,#b98a3d);border-radius:8px}.rub b{color:var(--gold,#b98a3d);margin-right:6px}.rub span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;margin:2px 2px;background:var(--card)}
.chain{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:8px;counter-reset:c}

.cmp2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}.cmp2>div{border-radius:10px;padding:10px 14px;font-size:14.5px;line-height:1.7}.cmp2 .weak{border:1px solid #e3b4ae;background:light-dark(#fbf0ee,#2a1b19)}.cmp2 .strong{border:1px solid #a9d3bd;background:light-dark(#eef7f2,#16241d)}.cmp2 ul{margin:4px 0;padding-left:1.2rem;font-size:13px}
.lbl2{display:block;font-size:12px;font-weight:800;color:var(--gold,#b98a3d);margin-top:6px}
.q{border-top:1px dashed var(--line);padding:8px 0}.opts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}.btn.ok{background:#2f7a55;color:#fff;border-color:#2f7a55}.btn.no{background:#b2453b;color:#fff;border-color:#b2453b}
.src{font-size:12.5px;color:var(--muted,#5d6679);margin-top:8px}
.diag .dst{font-weight:800;white-space:nowrap}.diag .dst.ok{color:#2f7a55}.diag .dst.mid{color:#a3621b}.diag .dst.no{color:#b2453b}
.fixrow,.lnrow{display:grid;grid-template-columns:150px 1fr;gap:6px 10px;align-items:start;margin:8px 0}.lnrow{grid-template-columns:120px 1fr 120px}.lnrow b,.fixrow b{font-size:14px;padding-top:8px}

details.chap{border:1px solid var(--line);border-radius:12px;background:var(--card);margin:10px 0}details.chap>summary{padding:12px 16px;cursor:pointer;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}details.chap>summary b{font-size:16px}details.chap .rb{font-size:12.5px;color:var(--gold,#b98a3d);font-weight:700}
details.chap[open]{border-color:var(--gold,#b98a3d)}.chb{padding:0 16px 14px;font-size:14.5px;line-height:1.7}.chb .kq{background:var(--tint,#f6efe1);border-radius:8px;padding:8px 10px}.chb .kq b,.chb .link b{color:var(--gold,#b98a3d);margin-right:6px}.chb .link{border-left:3px solid #1b2a4a;padding-left:10px}

select{max-width:100%}

을 위한 '우리 동네 예상 진료비 비교 가이드' 콘텐츠 배포 및 첫 예약 할인 쿠폰 지급"}}, "킥오프": {"eb11": {"f:p_name": "김민준(가명) · 23살 대학생, 여자친구와 주말마다 데이트 장소를 찾는 대학생", "f:p_src": "상상(가정) · 여행과 데이트를 계획할 때 장소 검색과 일정 조율에 어려움을 겪는 대학생을 대상으로 설정", "f:p_sit": "여자친구와 주말에 부산으로 1박 2일 여행을 계획하는 상황. 맛집과 관광지를 각각 검색하고 이동 경로와 운영 시간을 확인해야 하며, 예약도 업체마다 따로 진행해야 해서 시간과 비용적인 손실이 발생함.", "f:p_goal": "여행이나 데이트 장소를 한 번에 추천받고, 이동 일정과 시간표를 자동으로 구성하며, 여러 음식점과 관광지를 한 번에 예약하고 싶음. 현재는 네이버 지도, 블로그, SNS 등을 이용해 장소를 하나씩 검색하고 개별적으로 예약함.", "f:p_crit": "이동 거리와 시간, 전체 여행 및 데이트 비용", "f:p_fear": "추천받은 장소가 실제 후기와 다르거나 만족스럽지 않을 수 있다는 점 예약이 제대로 되지 않거나 이동 시간이 예상보다 길어지는 것", "f:st1": "커뮤니티 일정 링크로 알게 됨", "f:st2": "일정 복사·내 날짜로 수정", "f:st3": "충돌 점검·확정", "f:st4": "예약·유료 기능", "f:st5": "여행 중·다음 여행", "f:e1": "\"이런 앱이 있으면 데이트 코스를 찾는 시간을 줄이고 예약까지 한 번에 할 수 있겠는데?\"", "f:e2": "\"다른 사람이 짜놓은 코스를 그대로 사용할 수 있어서 편하네. 우리 일정에 맞게 시간과 장소만 조금 바꾸면 되겠다.\"", "f:e3": "\"예약까지 한 번에 할 수 있어서 편하네. 이제 일정에 맞춰 움직이기만 하면 되겠다.\"", "f:lw_why": "고객은 공유된 타임테이블을 자신의 여행 날짜와 숙소 위치에 맞게 수정하고, 추천 장소의 리뷰를 참고해 일정을 구성한다. 그러나 실제 예약 가능 시간이나 영업시간이 일정표와 다르면 다시 장소를 검색하고 이동 동선을 조정해야 한다. 특히 여러 업체의 예약정보가 분리되어 있어 일정과 예약이 정확하게 일치하는지 확신하기 어렵다. 따라서 ③단계는 감정 점수가 +2점으로 높지만, 예약 가능 여부와 일정의 실행 가능성을 최종 확인해야 하는 핵심 불안 지점이다. [근거: A — 팀이 작성한 고객 여정 지도·가설, 실제 고객 검증 필요]", "f:e4": "\"예약은 잘 된 것 같은데, 혹시 일정이 변경되거나 예약에 문제가 생기면 바로 알려주겠지?\"", "f:e5": "\"이번 여행은 계획대로 잘 다녀왔네. 다음에도 이 앱으로 코스를 추천받고 예약하면 편하겠다.\"", "f:as_q": "여행객은 일정에 충돌이 발생했을 때 AI가 대체 일정과 장소를 추천해 주면 직접 검색하고 수정하는 것보다 편리하다고 느끼며, 추천 일정을 이용할 것이다", "f:as_how": "여행이나 데이트 계획 경험이 있는 대학생 5명에게 일정 충돌 알림 및 대체 일정 추천 화면의 MVP 시제품을 보여 주고 11월 16일까지 반응을 조사한다", "f:as_ok": "5명 중 4명 이상이 AI가 추천한 대체 일정을 확인하고 실제 여행 계획에 사용하고 싶다고 답하면 가정이 맞다고 판단한다. 반대로 3명 이상이 직접 검색하거나 수정하는 것이 더 편하다고 답하면 가정을 다시 검토한다.", "f:r_a": "AI가 여행 중 일정 재확인과 다음 여행 준비 단계의 만족도를 +2점으로 예상하고, 리뷰 작성과 코스 재사용을 긍정적으로 평가함.", "f:r_b": "실제 이용자가 후기를 남기고 공유 일정을 다시 사용할지는 검증되지 않았으므로, 근거를 A(가정)로 유지하고 고객 반응을 추가 확인하기로 함.", "f:r_d": "단순 리뷰 작성보다 실제 여행 경험이 담긴 타임테이블 공유·재활용에 집중하기로 함. 후기 작성률과 공유 코스 재사용률을 측정하여 효과를 검증할 계획임.", "f:bmc_chg": "고객 관계: 자동 알림과 대체 일정 추천을 통한 편리한 고객 관리를 한다"}, "eux11": {"f:mv_v1": "아직 테스트 안 함. 기존 MVP를 바탕으로 AI 맞춤형 일정 생성, 숙소 및 방문 장소 변경, 정보 검증 기능이 고객의 일정 수립 부담을 줄이는지 확인할 예정이다.", "f:mv_hyp": "여행 계획을 세우는 데 어려움을 겪는 20대는 숙소 위치, 이동시간, 영업시간, 예상 비용을 고려한 AI 맞춤 일정과 자유로운 일정 수정 기능을 제공받으면, 별도의 앱에서 일정을 다시 작성하지 않고 자신의 취향에 맞게 수정한 후 저장할 것이다.", "f:u4": "장소별 정보 출처와 확인 날짜, 영업시간, 예상 비용, 예약 조건을 표시하고 확인되지 않은 정보는 ‘확인 필요’로 안내한다. 예약은 공식 또는 제휴 예약 페이지로 연결한다.", "f:fn_prob": "4→5단계에서 실제 여행이나 데이트에 추천 일정을 활용했지만 만족하지 못한 고객이 이탈할 것으로 예상된다. 따라서 정확한 장소 정보와 실시간 일정 수정 기능을 제공하고, 이전에 저장한 일정과 사용자의 취향을 반영하여 다음 여행에서도 더욱 편리하게 맞춤형 일정을 생성할 수 있는 화면이 필요하다.", "f:ia_diff": "① AI 맞춤 코스 재설계 — 사용자가 특정 장소, 숙소, 예산, 시간 등을 변경하면 기존 선호 조건을 유지하면서 이동 동선과 전체 일정을 자동으로 재구성한다.  ② 일정 검증 및 통합 예약 — 장소별 영업시간, 이동시간, 예상 비용, 예약 조건을 검토하여 실행하기 어려운 일정을 표시하고 대체안을 제시하며, 숙소·식당·체험 예약 정보를 일정과 연계한다.", "f:s1_n": "코스로 홈", "f:s2_n": "나에게 맞추기", "f:s3_n": "AI 맞춤 결과", "f:s4_n": "비용·일정 검증 및 예약", "f:s5_n": "내 코스 — 여행 실행 및 재사용", "f:u1": "부산 여행을 준비하는 민준이 코스로에 들어와 여행 조건을 입력하고, 자신의 취향과 예산에 맞는 일정을 생성·수정한 뒤 검증된 일정과 예약 정보를 확인하고 저장하면 끝.", "f:u6": "시스템: 장소·숙소 정보 조회 및 이동시간·예산·영업시간 충돌 계산 / AI: 사용자 조건 분석, 맞춤 일정 생성 및 대체 일정 추천 / 사람: 운영자가 장소 정보 오류 신고와 데이터 연동 상태를 확인하고 수정.", "f:ts_next": "1) 화면 4 — 장소별 정보의 출처와 확인 날짜를 더욱 눈에 띄게 표시하고, 확인된 정보와 확인이 필요한 정보를 명확하게 구분한다.\n2) 화면 3 — 숙소와 방문 장소 옆에 ‘장소 바꾸기’ 버튼을 배치하고, 변경 전후의 이동시간과 예상 비용을 비교하여 보여준다.\n3) 화면 4 — 예상 비용과 실제 결제 금액을 구분하고, 예약 가능 여부와 외부 예약 페이지 연결 방식을 명확하게 안내한다.\n4) 화면 5 — 여행 중 일정 변경 기능과 이전 여행 기록을 활용한 새 코스 만들기 기능을 더욱 눈에 띄게 배치하여 재사용을 유도한다.", "f:rp_title": "코스로(Cosro) — AI 맞춤형 여행 일정 설계·실행 플랫폼 MVP 검증", "f:rp_s1": "여행이나 데이트 계획에 어려움을 겪는 20대는 숙소, 방문 장소, 이동시간, 영업시간, 예약 정보가 여러 서비스에 흩어져 있어 실행 가능한 일정을 구성하지 못하고 계획 수립을 미룬다.", "f:rp_s2": "AI 맞춤 결과 화면에서 숙소 위치, 이동 동선, 영업시간, 예상 비용을 고려한 일정을 제공하고, 사용자가 원하는 장소를 변경하면 전체 일정을 재구성하며, 정보 검증과 예약 안내를 한곳에서 제공하여 여행 계획의 부담을 줄인다.", "f:rp_lim": "현재 MVP는 예시 데이터를 활용한 시제품이므로 실제 AI 추천 일정의 완성도, 장소 정보의 정확성, 실시간 일정 재구성의 효과, 통합 예약의 실현 가능성은 확인하지 못하였다. 또한 실제 여행 만족도와 고객의 재사용 의사, 유료 서비스 이용 의사도 검증되지 않았다. 향후 실제 장소 및 예약 데이터를 연동하고, 여행 계획에 어려움을 겪는 20대를 대상으로 일정 작성부터 여행 실행까지 테스트하여 검증할 예정이다."}, "emk12": {"tname": "킥오프", "segBy": "① 여행 및 데이트 계획 방식 ② 장소 검색과 예약 과정에서 중요하게 생각하는 편리성", "seg0": "여행이나 데이트 장소를 직접 검색하고 일정을 계획하는 사람들", "seg1": "다른 사람들의 후기와 추천을 참고해 장소를 선택하는 사람들", "seg2": "코스 추천부터 일정 구성과 예약까지 한 번에 해결하고 싶은 사람들", "tgt_why": "불편이 크다: 여행이나 데이트를 준비할 때 여러 앱과 SNS를 이용해야 하므로 장소 검색과 일정 구성에 시간이 많이 걸린다.\n\n우리가 닿는다: 스마트폰과 SNS를 자주 이용하는 고객을 대상으로 앱을 통해 코스 추천과 예약 서비스를 제공할 수 있다.\n\n많다: 데이트와 국내 여행을 계획하는 잠재 고객층이 다양하다.", "p_c": "데이트·여행 통합 코스 추천 서비스", "p_alt": "네이버 지도, 카카오맵, 블로그 및 SNS를 각각 이용해 장소를 검색하고 직접 일정을 계획하는 방법", "p_d": "여러 플랫폼을 따로 이용할 필요 없이 맞춤형 코스 추천부터 일정 자동 구성과 예약까지 한 번에 제공한다는 점", "tgt": "코스 추천부터 일정 구성과 예약까지 한 번에 해결하고 싶은 사람들", "p_cmp": "네이버 지도", "p_cn": "데이트·여행 코스와 예약을 한 번에", "pr": "고객의 취향과 목적에 맞는 데이트·여행 코스를 추천하고, 일정 자동 구성과 장소 예약을 한 번에 제공하는 서비스", "pc": "누가 내나: 일반 사용자 및 제휴 업체\n\n방식: 기본 코스 추천은 무료, 프리미엄 맞춤 코스는 유료, 업체 광고 및 예약 중개 수수료\n\n얼마: 프리미엄 월 4,900원(가정), 예약 중개 수수료 5%(가정)\n\n비교: 여러 유료 서비스를 따로 이용하는 것보다 편리하게 이용 가능", "pl": "스마트폰 앱과 모바일 웹을 통해 서비스를 제공하며, 앱스토어와 구글 플레이스토어에서 다운로드할 수 있도록 한다.", "pm": "인스타그램, 틱톡 등 SNS에 추천 데이트·여행 코스를 소개하고, 대학생 및 여행 관련 커뮤니티를 통해 홍보한다. 신규 가입자에게 프리미엄 기능 무료 체험을 제공한다.", "fn_b0": "앱 링크를 눌러 접속", "fn_b1": "추천 코스를 복사하고 날짜 변경", "fn_n1": "70", "fn_b2": "장소와 이동 시간을 확인하고 일정 확정", "fn_n2": "50", "fn_b3": "맛집·관광지 예약 또는 유료 기능 이용", "fn_b4": "여행 중 앱을 이용하거나 다음 여행에도 재사용", "fn_n3": "30", "fn_n4": "20", "k_in_f": "「여행 중 앱을 이용하거나 다음 여행에도 재사용」까지 온 사람 ÷ 「맛집·관광지 예약 또는 유료 기능 이용」까지 온 사람", "k_in": "여행 중 앱을 이용하거나 다음 여행에도 재사용", "k_cv_f": "「맛집·관광지 예약 또는 유료 기능 이용」까지 온 사람 ÷ 「장소와 이동 시간을 확인하고 일정 확정」까지 온 사람", "k_cv": "맛집·관광지 예약 또는 유료 기능 이용", "k_re_f": "「장소와 이동 시간을 확인하고 일정 확정」까지 온 사람 ÷ 「추천 코스를 복사하고 날짜 변경」까지 온 사람", "k_re": "장소와 이동 시간을 확인하고 일정 확정", "k_top": "4단계 예약·유료 기능에서 가장 많이 이탈한다고 가정한다. 고객이 예약 과정에서 추가 비용이나 결제 부담을 느낄 수 있기 때문이다. 이를 개선하기 위해 첫 예약 수수료 할인과 프리미엄 기능 무료 체험을 제공한다.", "chk_h": "비슷한 서비스 리뷰 · 앱스토어 평점 읽기", "chk_d": "11/22(일)"}, "ecomp13": {"core_ev": "여정 지도 집중 지점: 고객은 공유된 타임테이블을 자신의 여행 날짜와 숙소 위치에 맞게 수정하고, 추천 장소의 리뷰를 참고해 일정을 구성한다. 그러나 실제 예약 가능 시 라고 질문한 것을 통해 일정 변경에 따른 전체 일정의 재구성 여부가 중요한 확인 사항임을 파악하였다. 이를 바탕으로 일정 자동 재구성과 변경 전후 비교 기능을 우선 개선하기로 결정하였다. 다만 MVP v3의 짝팀 리뷰는 현재 0개이므로 추가 검증이 필요하다.", "d4": "네이버와 같은 대형 플랫폼이 기존 지도·예약 인프라와 방대한 고객 데이터를 활용하여 동일한 일정 추천 및 재구성 기능을 출시한다면 코스로의 경쟁력이 약화될 수 있다. 이를 극복하기 위해 개인별 여행 취향, 일정 변경 이력, 대체 일정 선택 기록 및 실제 방문 만족도 등 여행 실행 과정에 특화된 데이터를 축적하고 초개인화 추천에 활용하고자 한다. 다만 현재는 MVP 단계이므로 충분한 고객 데이터가 확보되지 않았으며, 고객의 재사용 의향과 일정 재구성의 정확성, 실제 예약 서비스와의 연계 가능성도 검증되지 않았다.", "d5": "최근 5개월 이내 여행이나 데이트 일정을 직접 구성한 경험이 있는 20대 대학생 5명에게 MVP v3를 제공하고, 숙소 변경 및 이동 지연 상황에서 일정을 수정하도록 한다. 5명 중 4명 이상이 별도의 설명 없이 일정 재구성과 변경 전후 비교를 완료하고, 기존 방식보다 일정 수정이 편리하다고 평가하면 통과로 판단한다. 다음 수업인 11월 25일까지 김동의가 MVP 테스트를 총괄하고 팀원들이 사용자 평가 결과를 수집한다. [가정: 검증 목표 및 일정]", "ff_buy_why": "무료로 이용할 수 있는 경쟁 서비스가 많아 이용자가 쉽게 다른 앱으로 이동할 수 있음.", "ff_sub_who": "여행 일정을 직접 계획하는 여행객", "ff_sub_lv": "강", "ff_sub_why": "블로그, 인스타그램, ChatGPT 등을 이용하면 별도의 여행 앱 없이도 여행 일정을 직접 만들 수 있음.", "ff_resp": "대체재의 위협이 가장 강함 → 여행 장소 검색부터 일정 자동 생성, 여러 장소의 통합 예약까지 한 번에 제공하여 직접 계획하는 번거로움을 줄인다.", "pos_why": "① 우리 서비스는 일정 자동 생성과 통합 예약 기능으로 시간과 편리성에서 경쟁 서비스보다 높은 가치를 제공한다.\n② 기존 서비스는 장소 검색이나 예약을 각각 진행해야 하는 번거로움이 있다.\n③ 여행 일정 준비에 드는 시간과 노력을 줄이고 싶은 고객을 주요 대상으로 한다.", "pos_no": "최저가 경쟁, 전국의 모든 여행지 무분별한 확대, 모든 고객의 취향을 만족시키려는 전략은 피한다.", "pos_kpi": "① 여행 코스 자동 생성 완료율 ② 예약 완료율 ③ 여행 일정 생성에 걸리는 평균 시간 ④ 이용자 재방문율", "pos_stmt": "우리는 코스 추천부터 일정 구성과 예약까지 한 번에 해결하고 싶은 사람들에게 차별화로 경쟁한다. 다르게 하는 것. 이것으로 가장 강한 신규 진입자의 위협에 대응하고, 최저가 경쟁, 전국의 모든 여행지 무분별한 확대, 모든 고객의 취향을 만족시키려는 전략은 피한다. 성과는 ① 여행 코스 자동 생성 완료율 ② 예약 완료율 ③ 여행 일정 생성에 걸리는 평균 시간 ④ 이용자 재방문율로 확인한다.", "vc_sel": "tech|proc", "vc_how": "기술 개발 — 여행 날짜, 숙소 위치, 개인 취향을 반영해 최적의 여행 코스를 자동 생성하고 여러 장소의 예약을 한 번에 진행할 수 있도록 한다.\n\n조달 — 음식점, 관광지, 숙박업체와 제휴하여 정확한 장소 정보와 예약 서비스를 제공한다.", "ai": "AI를 활용하여 MVP 화면 설계, HTML 코드 작성, 경쟁우위 분석 및 차별화 전략을 구체화하였다. 초기에는 AI가 제안한 맞춤형 일정 추천과 정보 통합을 핵심 차별화 요소로 설정하였으나, 기존 지도 및 AI 서비스에서도 유사한 기능을 제공할 수 있다는 점을 고려하여 여행 중 발생하는 변수에 대응하는 일정 자동 재구성과 변경 전후 비교를 중심으로 수정하였다. 또한 실제 예약 및 결제 기능과 향후 구현할 기능을 구분하여 MVP의 한계를 명확히 하였다."}}, "1팀": {"eb11": {"f:p_name": "민서 · 20세 · 대학가 근처 자취 중인 대학교 1학년", "f:p_src": "팀원들의 대학 생활 경험과 1인 가구의 생활 불편 사례를 바탕으로 설정한 가상 페르소나", "f:p_sit": "평일에는 수업과 과제를 하고 저녁에는 아르바이트까지 하느라 세탁물을 맡기거나 택배를 찾으러 갈 시간이 부족함", "f:p_goal": "생활에 필요한 일을 다른 사람에게 맡기고 학업과 개인 시간에 집중하고 싶음 / 현재는 직접 세탁소에 방문하거나 편의점과 마트에서 필요한 물건을 구매함", "f:p_crit": "대행 비용과 처리 시간", "f:p_fear": "물건이 분실되거나 요청한 내용과 다르게 처리될 가능성, 추가 비용 발생", "f:st1": "학교 커뮤니티에서 생활 업무를 대신해 주는 해드립니다 서비스를 발견함", "f:st2": "세탁물 수거, 택배 수령, 장보기 등의 서비스와 이용 비용을 비교함", "f:st3": "앱에서 원하는 서비스를 선택하고 요청 사항과 수거 장소를 입력함", "f:st4": "건당 요금 결제", "f:st5": "편리하게 생활 업무를 해결한 경험을 바탕으로 다음에도 필요한 서비스를 신청함", "f:lw_why": "서비스 이용 요금이 예상보다 비싸거나 추가 비용이 발생할 수 있고, 물건을 맡긴 후 제대로 전달되고 있는지 확인하기 어려워 불안함을 느낌. 특히 결제 후 진행 상황을 알 수 없다는 점에서 서비스 이용을 망설일 수 있음.", "f:e1": "민서 “세탁물이나 택배 찾으러 갈 시간이 없는데 이런 것도 대신해 준다고?“", "f:e4": "민서 \"결제는 했는데 추가 비용이 발생하지는 않을까? 내가 맡긴 물건이 제대로 수거되고 있는지 궁금하다.\"", "f:e2": "민서 “편리할 거 같긴 한데, 직접 다녀오는 것보다 비용이 너무 비싸면 고민 되겠는데?”", "f:e5": "민서 \"이번에는 편하게 이용해서 좋았어. 다음에도 필요할 때 이용하고 싶은데 다른 서비스도 믿고 맡길 수 있을까?\"", "f:e3": "민서 “내가 적은 내용대로 제대로 처리해 줄까? 물건이 없어지거나 잘못 전달ㄷ", "f:bmc_chg": "고객관계 – 수거 진행 상황과 완료 사진을 알림으로 제공하여 고객 만족도와 신뢰도를 높인다\\.", "f:as_q": "자취생은 세탁물 수거 및 장보기 대행 서비스를 이용할 때 진행 상황과 완료 여부를 사진 및 알림으로 확인할 수 있으면 서비스를 더 자주 이용할 것이다\\.", "f:as_how": "대학가 자취생 2명에게 서비스 MVP 화면과 수거 알림 기능을 보여 주고 11월 16일까지 의견을 확인한다.", "f:as_ok": "자취생 2명 중 2명 이상이 알림 기능이 편리하고 서비스를 이용할 의향이 있다고 답하면 맞음. 이용 의향이 없거나 알림 기능이 필요하지 않다고 답하면 틀림.", "f:r_a": "대학가 자취생을 대상으로 세탁물 수거와 장보기 대행 서비스를 제공하고, 신청부터 완료까지 편리하게 이용할 수 있는 서비스 흐름을 제안함.", "f:r_b": "실제 자취생의 생활 패턴에 맞게 세탁물 수거와 장보기 기능을 중심으로 수정하고, MVP 테스트를 통해 사용자의 반응을 확인하도록 변경함.", "f:r_c": "고객에게 서비스 진행 상황을 알림으로 제공하고 완료 사진을 확인할 수 있도록 제안함.", "f:r_d": "고객이 서비스를 더 편리하고 믿을 수 있도록 수거 진행 상황과 완료 알림 기능을 추가함."}, "eux11": {"f:s1_n": "첫 화면", "f:s2_n": "나에게 맞추기", "f:s3_n": "맞춤 결과", "f:s4_n": "돈·신뢰 확인", "f:s5_n": "완료·다시 오게", "f:fn_prob": "결제 뒤 진행 상황이 안 보여서 첫 이용 후 다시 안 씀 → 결제 직후 \"기사 배정·수거 예정 시각\"을 보여 줘야 함", "f:ia_diff": "진행 상황 (사진으로 확인) — 맡긴 물건이 지금 어디 있는지 보여 주는 탭", "f:u6": "시스템: 고객의 세탁 신청 내용과 결제 금액 확인 및 주문 접수 / AI: 비슷한 시간과 장소의 주문을 묶어 기사 배정 / 사람: 기사가 배정된 주문을 확인하고 세탁물 수거 준비", "f:u1": "학교 커뮤니티에서 ‘해드립니다’ 홍보 글을 보고 들어와 세탁물 수거 신청과 결제를 완료한 뒤, 세탁물이 전달되었다는 알림을 받으면 끝.", "f:u4": "결제 전에 총 이용 금액, 추가 요금 여부, 수거 및 전달 예정 시간을 보여줘 고객이 믿고 결제할 수 있도록 함.", "f:mv_hyp": "대학가에 거주하는 1인 가구 고객은 서비스 선택 및 신청 화면을 보면 필요한 생활 업무를 선택하고 요청 정보 입력까지 완료할 것이다.", "f:mv_v1": "MVP를 통해 서비스 신청 화면과 주요 기능의 구성을 확인했다. 다만 처음 이용하는 고객이 별도 설명 없이 신청 과정을 이해하는지, 비용과 대행 과정에 대한 불안 없이 다음 단계로 이동하는지는 추가 테스트가 필요하다.", "f:rp_title": "생활 심부름을 간편하게 해결하는 통합 플랫폼 — 해드립니다 MVP 검증", "f:rp_s1": "대학가에 거주하는 1인 가구 고객이 서비스를 신청하고 결제한 뒤 기사 배정 여부와 수거 예정 시간을 확인할 수 없어 불안함을 느끼고 이용을 망설인다.", "f:rp_s2": "결제 완료 화면에서 기사 배정 상태와 수거 예정 시간을 보여주고, 진행 상황을 알림으로 안내해 고객이 안심하고 서비스를 이용할 수 있도록 한다.", "f:rp_lim": "실제 대학가 자취생을 대상으로 서비스를 테스트하지 않아 신청 과정이 얼마나 편리한지, 실제 이용 의사가 있는지는 확인하지 못했다. 다음에는 자취생 3명에게 MVP 화면을 보여주고 서비스 신청 의사와 불편한 점을 확인할 것이다.", "f:ts_next": "1. 화면 4 신청 정보 입력 → 필수 입력 항목과 작성 예시를 추가해 무엇을 적어야 하는지 쉽게 안내하기\n2. 화면 5 비용 안내 → 예상 비용과 [가격 검증 중] 표시를 더 눈에 띄게 배치하기\n3. 서비스 선택 화면 → 세탁물 수거, 택배 수령, 장보기, 혼밥 매칭, 반려동물 산책의 설명을 간단하게 정리하기\n4. 신청 완료 화면 → 요청 접수 여부와 다음 진행 단계를 명확하게 보여주기"}, "emk12": {"tname": "해드립니다", "fn_b0": "학교 게시판에서 생활 업무 대행 서비스를 처음 접함", "pr": "고객이 앱에서 세탁물·수선물 수거, 생활 심부름, 장보기 등을 신청하면 원하는 장소와 시간에 맞춰 수행자를 배정하고 서비스를 제공한다. 신청 후에는 기사 배정 여부와 수거 예정 시간을 앱에서 확인할 수 있도록 한다.", "pc": "고객이 서비스 이용 건마다 이용료를 지불하는 방식으로 운영한다. 기본 이용료는 건당 3,000원[가정]으로 설정하고, 이동 거리나 추가 요청에 따라 추가 요금을 받을 수 있다. 추후 정기 이용권과 구독 상품도 도입한다.", "pl": "대학가 세탁소와 수선집, 대학 게시판의 QR코드 등을 통해 처음 서비스를 알리고, 앱에서 원하는 서비스를 신청하도록 한다. 이후 앱에서 진행 상황을 확인하고 완료된 물품을 지정한 장소에서 받는다.", "fn_b1": "다른 대행 서비스와 비교하며 해드립니다의 편리성을 확인함", "fn_b2": "필요한 서비스와 희망 수거 시간을 선택하고 신청서를 작성함", "fn_b3": "대행 비용과 처리 내용을 확인한 뒤 실제 서비스를 이용함", "fn_b4": "이용 경험이 만족스러워 다른 생활 업무도 추가로 신청함", "fn_n1": "70명", "fn_n2": "50명", "fn_n3": "30명", "fn_n4": "26명", "k_in_f": "「다른 대행 서비스와 비교하며 해드립니다의 편리성을 확인함」까지 온 사람 ÷ 「학교 게시판에서 생활 업무 대행 서비스를 처음 접함」까지 온 사람", "k_in": "다른 대행 서비스와 비교하며 해드립니다의 편리성을 확인함", "k_cv_f": "「대행 비용과 처리 내용을 확인한 뒤 실제 서비스를 이용함」까지 온 사람 ÷ 「필요한 서비스와 희망 수거 시간을 선택하고 신청서를 작성함」까지 온 사람", "k_cv": "대행 비용과 처리 내용을 확인한 뒤 실제 서비스를 이용함", "k_re_f": "「이용 경험이 만족스러워 다른 생활 업무도 추가로 신청함」까지 온 사람 ÷ 「대행 비용과 처리 내용을 확인한 뒤 실제 서비스를 이용함」까지 온 사람", "k_re": "이용 경험이 만족스러워 다른 생활 업무도 추가로 신청함", "chk_h": "비슷한 서비스 리뷰 · 앱스토어 평점 읽기", "chk_d": "11월 22일", "k_top": "전환 - 3단계->4단계 / 앱에서 서비스를 선택하고 요청 사항까지 작성한 고객이 실제 결제까지 이어지는 비율을 가장 먼저 높이겠다. 생활 대행 서비스는 비용과 개인정보 제공, 대행 과정에 대한 걱정으로 이용을 망설일 수 있기 때문에 요금 안내를 명확하게 하고 수행자 정보와 처리 절차를 보여주어 고객의 신뢰를 높이는 것이 중요하다.", "pm": "대학가 게시판과 제휴 세탁소에 홍보물을 부착하고 QR코드로 앱에 접속하도록 유도한다. 첫 이용 고객에게 할인 혜택을 제공하고 친구 추천 이벤트와 이용 후기 이벤트를 진행해 신규 고객과 재이용 고객을 늘린다.", "segBy": "혼자 생활하는 경험과 집안일에 사용하는 시간 및 부담 정도", "seg0": "자취를 처음 시작해 청소, 세탁, 정리 등 기본적인 생활 관리 방법이 익숙하지 않은 대학생", "seg1": "학교나 직장 생활로 바빠서 집안일을 할 시간이 부족하고 생활 업무를 미루는 대학생", "seg2": "집안일을 직접 처리할 수 있지만 반복되는 청소와 세탁, 각종 생활 심부름에 지친 1인 가구", "tgt_why": "시간이 부족한 사람들은 집안일을 하기 싫어서가 아니라 처리할 시간이 없어서 생활 업무를 계속 미루게 된다. 필요한 서비스를 먼저 추천하고 여러 생활 업무를 대신 관리해 준다면 집안일에 쓰는 시간을 줄이고 자신의 일상에 더 집중할 수 있기 때문이다.", "p_c": "1인 가구 맞춤형 생활 관리 대행 서비스", "p_alt": "집안일을 직접 처리하거나 가족과 지인에게 부탁하고, 필요한 일이 생길 때마다 개별 심부름 및 대행 서비스를 찾아 신청하는 방법", "p_d": "기존 서비스처럼 고객이 필요한 일을 하나씩 찾아서 요청하는 것이 아니라, 고객의 생활 패턴과 불편 사항을 분석해 필요한 서비스를 먼저 추천하고 여러 생활 업무를 한곳에서 관리할 수 있도록 한다.", "p_cmp": "일반 심부름 대행 서비스", "p_cn": "생활 일은 맡기고, 내 시간은 지키기.", "tgt": "학교나 직장 생활로 바빠서 집안일을 할 시간이 부족하고 생활 업무를 미루는 대학생"}, "ecomp13": {"core_ev": "여정 지도 집중 지점: 서비스 이용 요금이 예상보다 비싸거나 추가 비용이 발생할 수 있고, 물건을 맡긴 후 제대로 전달되고 있는지 확인하기 어려워 불안함을 느낌. 특히 결제 후 진행 상황을 알 수 없다는 점에서 서비스 이용을 망설일 수 있음. / 여정 만족도 -1 (앱에서 원하는 서비스를 선택하고 요청 사항과 수거 장소를 입력함) / 깔때기 많이 빠짐 — 가격에 민감한 자취생: 기본 이용료와 추가 비용이 얼마나 발생할지 몰라 부담을 느껴서 / 짝팀 테스트 [이해] \"맞춤 결과가 나왔는데 이게 어떤 의미인지 잘 모르겠어요.\"", "core_want": "내 상황에 맞는 추천 결과가 왜 나왔는지 쉽게 이해하고, 추가 비용까지 미리 확인해 안심하고 서비스를 선택하고 싶다.", "c1_n": "생활 심부름 대행 앱", "c1_w": "고객이 장보기, 물품 전달, 생활 심부름 등을 한 번에 요청하고 주변 헬퍼와 연결되어 번거로운 일을 해결할 수 있도록 해준다.", "c1_src": "해주세요 공식 홈페이지 및 앱 소개에서 장보기, 픽업, 반려동물 케어, 생활 대행 서비스 확인.", "c2_n": "직접 방문 및 가족·지인에게 심부름 부탁하기", "c2_w": "고객이 직접 세탁소나 마트에 방문하거나 가족과 지인에게 부탁하여 세탁물 수거와 장보기 등 필요한 일을 해결한다.", "c2_src": "팀에서 설정한 주요 고객의 기존 생활 방식에 대한 가정 (실제 고객 인터뷰 및 이용 경험 확인 필요)", "k1": "가격", "k2": "시간 · 속도", "k3": "믿을 수 있나", "k4": "찾기 · 쓰기 쉬움", "k5": "내 상황에 맞춤", "s_u_1": "4", "s_u_3": "4", "s_u_2": "5", "s_u_4": "4", "s_u_5": "5", "s_a_1": "3", "s_a_2": "4", "s_a_3": "3", "s_a_4": "4", "s_a_5": "3", "s_b_1": "5", "errc": "기존 심부름 서비스처럼 개별적으로 일을 맡기는 방식에서 벗어나 세탁·장보기·택배 등 자취생에게 필요한 서비스를 하나의 앱으로 통합했다. 또한 지역별 묶음 배송으로 시간과 운영 비용을 줄이고, 기본 이용료와 추가 비용을 미리 안내하여 가격에 대한 불안감을 줄이는 기능을 추가했다.", "s_b_5": "2", "s_b_4": "2", "s_b_3": "3", "s_b_2": "2", "ff_new_who": "배달 플랫폼의 생활 대행 서비스 확장 및 지역 기반 신규 심부름 앱", "ff_new_lv": "중", "ff_new_why": "기존 배달 플랫폼은 이미 확보한 고객과 운영 경험을 활용할 수 있지만, 지역별 수행 인력과 제휴처 확보에는 어려움이 있을 수 있다.", "ff_sup_who": "대행 수행 기사 및 제휴 세탁소", "ff_sup_lv": "중", "ff_sup_why": "수행 기사와 제휴 세탁소가 충분하지 않으면 서비스 처리 속도와 품질이 떨어질 수 있으며, 특히 이용자가 몰리는 시간에는 인력 확보가 중요하다.", "ff_buy_why": "고객은 서비스 가격과 이용 편리성을 비교하고, 더 저렴하거나 간편한 대체 서비스를 발견하면 쉽게 이용을 중단할 수 있다.", "ff_buy_lv": "강", "ff_buy_who": "가격에 민감하고 필요에 따라 서비스를 바꿀 수 있는 대학가 자취생", "ff_riv_lv": "중", "ff_riv_why": "이미 비슷한 생활 편의 서비스를 제공하는 업체가 있어 고객이 다른 서비스를 선택할 가능성이 있다. 다만 여러 생활 업무를 한곳에서 신청할 수 있다는 점으로 차이를 만들 수 있다.", "ff_riv_who": "생활 심부름 대행 앱 및 세탁 수거·배송 서비스", "ff_sub_who": "직접 세탁소 방문, 편의점 택배 이용, 가족·친구에게 심부름 부탁하기", "ff_sub_lv": "강", "ff_sub_why": "별도의 대행 비용 없이 직접 해결하거나 주변 사람에게 부탁할 수 있어 서비스 이용 필요성이 낮아질 수 있다.", "ff_resp": "대체재(직접 방문 및 가족·지인에게 부탁하기)가 가장 강함 -> 여러 생활 업무를 하나의 앱에서 신청하고 진행 상황을 확인할 수 있도록 해 직접 처리하는 번거로움을 줄인다.", "pos": "원가 집중 (좁은 시장 · 싸게)", "pos_why": "① 점수: 대학가 자취생을 대상으로 운영 범위를 좁혀 불필요한 운영 비용을 줄일 수 있다.\n② 힘: 대학가 주변의 세탁소와 편의점을 활용하고 가까운 요청을 묶어 이동 비용을 절감할 수 있다.\n③ 고객: 가격에 민감한 자취생에게 부담이 적은 생활 대행 서비스를 제공할 수 있다.", "pos_no": "전국 단위 확장, 고급 프리미엄 서비스, 무분별한 서비스 종류 확대, 모든 고객층 공략하기.", "pos_kpi": "건당 평균 운영 비용 = 총 운영 비용 ÷ 전체 처리 건수", "pos_stmt": "우리는 합리적인 가격의 생활 대행 서비스를 원하는 대학가 자취생을 대상으로, 대학가 주변의 제휴 업체와 수행 인력을 활용하고 비슷한 시간대의 요청을 묶어 운영 비용을 줄인다. 이를 통해 고객에게 부담이 적은 세탁·장보기·택배 대행 서비스를 제공한다."}}, "굿즈팀": {"eb11": {"f:p_name": "김서연(22세). 좋아하는 캐릭터와 작품을 바탕으로 자신만의 굿즈를 제작하고 싶은 대학생.", "f:p_src": "굿즈 제작 희망자라는 가상 고객 유형을 바탕으로 설정함. 실제 인터뷰를 통한 검증은 필요함.", "f:p_sit": "원하는 디자인의 키링을 제작하고 싶지만, 제작 업체의 최소 주문 수량이 많고 혼자 모든 제작비를 부담하기 어려움.", "f:p_goal": "원하는 디자인의 키링을 제작하고 싶지만, 제작 업체의 최소 주문 수량이 많고 혼자 모든 제작비를 부담하기 어려움.", "f:p_crit": "제작 비용과 굿즈 품질. 특히 공동제작을 통해 비용을 얼마나 줄일 수 있는지 중요하게 생각함.", "f:p_fear": "원하는 디자인의 키링을 제작하고 싶지만, 제작 업체의 최소 주문 수량이 많고 혼자 모든 제작비를 부담하기 어려움.", "f:st1": "SNS에서 다른 창작자가 퍼니팅을 통해 굿즈 제작 참여자를 모집하는 게시물을 발견함.", "f:st2": "퍼니팅에서 굿즈 아이디어와 예상 제작비, 최소 참여 인원 등을 확인하고 참여 여부를 고민함.", "f:st3": "자신이 제작하고 싶은 키링의 디자인과 희망 수량을 입력하고 공동제작 참여자를 모집함.", "f:st4": "모집 인원과 제작 조건을 확인한 뒤 펀딩에 참여하고 정해진 조건에 따라 결제함.", "f:st5": "제작 결과와 참여 경험을 확인한 뒤 다른 굿즈 펀딩에 참여하거나 새로운 아이디어를 등록함.", "f:lw_why": "굿즈 제작에 관심은 있지만 예상 제작비와 최소 참여 인원을 확인하면서 실제 진행이 성사될 수 있을지 불안함을 느낀다. 특히 참여자가 충분히 모이지 않을 경우 제작이 취소될 가능성이 있으며, 공동제작 방식이나 신뢰성 높은 제작비용 산정에 대한 이해가 부족할 수 있다.", "f:as_q": "고객은 상품 수령 후 자신의 평가와 새로운 굿즈 아이디어를 직접 등록할 수 있다면, 서비스에 대한 소속감과 만족도가 높아지고 향후 새로운 공동제작 프로젝트에도 참여할 의향이 높아질 것이다.", "f:e1": "\"내가 원하는 장르나 카테고리의 굿즈들을 퀄리티 괜찮게, 그리고 저렴하게 살 수 있다고?\"", "f:e2": "진짜 이 가격에 맞춰질까? 혹시 중간에 인원 안 채워지면 어쩌지?", "f:e5": "\"내가 원했던 디자인의 굿즈를 직접 소유하게 되니 정말 만족스럽다! 다음에는 다른 캐릭터 굿즈도 만들어 보고 싶다.\"", "f:e3": "\"도안만 올리면 끝인가? 모바일로 신청하려니 파일 올리기 좀 번거롭네.\"", "f:e4": "\"드디어 제작 인원이 모였네! 이제 내가 원했던 굿즈를 만들 수 있겠다. 다만 최종 결제 금액이 부담스럽지는 않을까?\"", "f:as_ok": "참여자들이 상품 평가와 신규 아이디어 등록 기능을 유용하다고 판단하고, 직접 새로운 굿즈 아이디어를 제안하거나 향후 공동제작에 참여할 의향을 보이면 가정이 맞다고 판단한다. 반대로 해당 기능에 관심을 보이지 않거나 재참여 의향에 변화가 없다면 가정을 수정한다.", "f:as_how": "캐릭터 굿즈 구매 경험이 있거나 제작에 관심이 있는 20대 소비자 3~5명에게 상품 평가 및 신규 아이디어 등록 기능이 포함된 MVP 화면을 보여 주고, 11월 16일까지 의견을 수집한다.", "f:bmc_chg": "핵심활동: 고객 피드백 분석 및 신규 굿즈 아이디어 발굴 고객관계: 상품 평가와 의견 수렴을 통한 지속적인 고객 참여 유도 가치제안: 고객 의견을 반영하여 소비자 취향에 맞는 굿즈 제작 기회 제공", "f:r_a": "ChatGPT와 Claude는 서비스 첫 사용 단계의 감정 점수를 positive(+2)로 평가함.\"", "f:r_b": "실제 사용자 인터뷰 및 MVP 테스트 결과, 초기 진입 장벽이 높아 첫 사용 감정 점수를 negative(-2)로 하향 조정함.\""}, "eux11": {"f:fn_prob": "결제 직전에 믿지 못해 떠남 → 결제 버튼 옆에 \"미달 시 전액 환불·돈 보관\"을 보여 줘야 함", "f:s1_n": "첫 화면 – 나만의 굿즈 시작하기", "f:s2_n": "나에게 맞추기 – 원하는 굿즈 찾기", "f:s3_n": "맞춤 결과 – 함께 만들 사람 찾기", "f:s4_n": "돈·신뢰 순간 – 안심하고 결제하기", "f:s5_n": "끝·다시 오게 – 제작 진행 확인하기", "f:u6": "시스템: 결제금 안전 보관, 목표 인원 미달 시 전액 환불 처리\nAI: 참여 인원과 예상 제작비 분석, 제작 진행 가능성 안내\n사람: 제작자가 최종 제작 조건 확인, 운영자가 결제 및 환불 문의 대응", "f:mv_hyp": "창작자는 \"목표 미달 시 전액 환불\"을 결제 버튼 옆에서 보면, 모르는 개설자의 모집에도 참여할 것이다", "f:u4": "화면 4 · 결제 전 총금액, 예상 제작 일정, 목표 모집 인원, 환불 조건과 제작사 정보를 확인할 수 있습니다. 목표 미달 시 처리 방식도 안내합니다.", "f:mv_v1": "11/9 확인할 가정이 비어 있음 — 이번 테스트로 처음 확인 (\"아직 테스트 안 함\")", "f:u1": "SNS • 커뮤니티 링크에서 들어와 원하는 굿즈 제작 확정 및 참여 완료 알림을 받으면 끝", "f:ia_diff": "개설자의 이전 모집 성공·배송 완료 횟수를 배지로 보여준다", "f:rp_s1": "개인 창작자가 굿즈 제작을 준비할 때 최소 주문 수량과 제작비 부담으로 어려움을 겪으며, 공동제작에 참여할 사람을 충분히 모집할 수 있을지 불안해한다.", "f:rp_title": "퍼니팅 — 창작자의 굿즈 공동제작 부담을 줄이는 아이디어 펀딩 플랫폼", "f:rp_lim": "창작자들이 실제로 공동제작에 참여할 의향이 있는지, 예상 제작비 절감 효과가 충분한지 확인하지 못했다. 향후 잠재 고객 인터뷰와 제작 업체 견적 비교를 통해 검증할 계획이다.", "f:rp_s2": "퍼니팅의 공동제작 매칭 화면에서 유사한 굿즈 아이디어를 가진 사용자와 예상 제작비, 최소 주문 수량을 한눈에 보여 줘 참여 결정의 어려움을 줄였다.", "f:ts_next": "화면 5의 환불 조건을 결제 버튼 바로 위에 배치해 쉽게 확인하도록 개선한다.\n화면 1~4의 공동제작 참여 과정과 예상 제작비를 간단하게 정리해 사용자가 혼란 없이 진행하도록 개선한다.\n결제 전 최종 확인 화면을 추가해 참여 조건과 금액을 다시 확인하도록 한다."}, "emk12": {"tname": "굿즈팀", "segBy": "굿즈를 제공하는 업체인가? 대량 또는 소량으로 주문하는 사람인가? (굿즈 제작 목적과 제작 경험에 따라 구분한다.)", "seg0": "좋아하는 캐릭터나 아이돌을 위해 자신만의 굿즈로 만드려는 학생", "seg1": "개인적으로 자신의 굿즈를 만들고 싶은 사람.", "seg2": "자신의 그림으로 자체 굿즈를 만들어 판매하려는 창작자", "pc": "누가 내나: 고객(창작자/참여자) -> 방식: 건당 플랫폼 수수료 또는 공동제작 성사 시 소정의 매칭 수수료 -> 얼마: 0원 [가정] (기본 참여 무료, 펀딩 성사 시 제작비만 정산) ->  무엇과 비교: 기존에 혼자서 제작 업체 최소 주문 수량(MOQ)을 감당하며 전액 부담하던 비용보다 훨씬 싸다", "tgt": "좋아하는 캐릭터나 아이돌을 위해 자신만의 굿즈로 만드려는 학생", "tgt_why": "좋아하는 캐릭터나 아이돌의 굿즈를 직접 제작하고 싶지만, 최소 주문 수량과 제작비에 부담을 느낄 수 있다. 퍼니팅은 비슷한 아이디어를 가진 창작자들을 연결해 공동제작을 지원하므로 해당 고객의 문제를 해결하는 데 적합하다고 판단했다.", "pl": "처음 만나는 곳: X(트위터) 및 인스타그램 굿즈 제작 홍보 게시물/오픈채팅방 -> 깔거나 들어오는 곳: 퍼니팅 웹/앱 서비스 링크 -> 계속 쓰는 곳: 퍼니팅 앱 및 마이페이지", "p_c": "굿즈 제작 및 판매 앱", "pm": "깔때기에서 가장 많이 이탈하는 단계(결제 직전 신뢰 부족)를 겨냥하여, \"결제 버튼 바로 옆에 '미달 시 전역 환불·돈 보관' 문구 노출 및 초기 참여자 할인 혜택/후기 공유\" 이벤트 진행", "fn_b0": "창작자의 굿즈를 원하는 팬들이 퍼니팅에 들어감", "fn_b1": "창작자의 펀딩에서 창작자를 어떻게 찾을지 몰라서 빠져나감.", "p_alt": "펀딩 또는 구글, 네이버 폼, 윗치폼과 같은 C2C 플랫폼을 이용", "p_d": "AI가 유사한 굿즈 아이디어를 가진 창작자를 추천하고, 공동제작 참여와 제작조건 조율을 지원한다.", "fn_n1": "85", "fn_b2": "펀딩 화면에서 자신이 원하는 창작자를 찾고 그 조건에 사람들이 빠져나감. (같은 목적의 사람들을 찾기 어려움)", "fn_n2": "35", "p_cmp": "퍼니팅", "fn_n3": "25", "fn_n4": "20", "k_in_f": "「창작자의 펀딩에서 창작자를 어떻게 찾을지 몰라서 빠져나감.」까지 온 사람 ÷ 「창작자의 굿즈를 원하는 팬들이 퍼니팅에 들어감」까지 온 사람", "k_in": "창작자의 펀딩에서 창작자를 어떻게 찾을지 몰라서 빠져나감.", "fn_b3": "펀딩화면에서 자신이 원하는 창작자의 펀딩에 들어가 창작자의 조건을 봄. (조건이 마음에 안 듦)", "k_cv_f": "「펀딩화면에서 자신이 원하는 창작자의 펀딩에 들어가 창작자의 조건을 봄. (조건이 마음에 안 듦)」까지 온 사람 ÷ 「펀딩 화면에서 자신이 원하는 창작자를 찾고 그 조건에 사람들이 빠져나감. (같은 목적의 사람들을 찾기 어려움)」까지 온 사람", "p_cn": "최소수량 없이 굿즈합작 또는 1개부터 만드는 공동 굿즈", "fn_b4": "다른 굿즈에 투자하거나 또는 자신이 원하는 굿즈를 만듬.", "k_cv": "펀딩화면에서 자신이 원하는 창작자의 펀딩에 들어가 창작자의 조건을 봄. (조건이 마음에 안 듦)", "k_re_f": "「다른 굿즈에 투자하거나 또는 자신이 원하는 굿즈를 만듬.」까지 온 사람 ÷ 「펀딩화면에서 자신이 원하는 창작자의 펀딩에 들어가 창작자의 조건을 봄. (조건이 마음에 안 듦)」까지 온 사람", "k_re": "다른 굿즈에 투자하거나 또는 자신이 원하는 굿즈를 만듬.", "k_top": "펀딩을 원하는 사람이 후원금액을 최소치만 정하면 이 정도의 후원을 한다면 창작자의 굿즈를 여기까지 받으실 수 있습니다.", "pr": "나에게 맞추기 — 카테고리 취향 검사와 굿즈종류 취향 검사를 통해, 비슷한 아이디어를 가진 창작자를 연결해주는 기능", "chk_h": "친구 · 지인 5명에게 MVP를 써 보게 하고 어디서 멈추는지 보기", "chk_d": "11/22일"}, "ecomp13": {"core_ev": "깔때기 조금 빠짐 — 옵션 고르기가 귀찮은 사람: 옵션이 많아 고르다 지침", "core_want": "안전하고 믿을 수 있는 결제로 부담 없이 굿즈 펀딩에 참여하고싶다", "c1_n": "마플샵"}}, "5팀(won팀)": {"eb11": {"f:st1": "정비를 자주 하는 친구가 어플을 추천(가정)", "f:st2": "견적 받고 검색해 봄", "f:st3": "사진 올려 해석 받기", "f:st4": "카운터에서 결제 결정", "f:st5": "다음 정비 때 다시", "f:e1": "면허딴 지 얼마 안 됐는데 카센터 아저씨가 부르는 게 값이라 너무 찜찜해... 누군가 내 명세서 좀 봐줬으면 좋겠네.", "f:p_name": "주형•22살•첫 차 4개월된 사회초년생", "f:p_src": "주형•인터뷰1명+팀원1명 경험을 합침(가정)", "f:p_sit": "주형•차를 타고 집을 가던 중 갑자기 영문모를 계기판에 경고등이 떠서 처음 간 정비소에서 견적서를 받음", "f:p_goal": "주형•지금 당장 필요한 정비만 하여 그 값을 알맞게 내고 싶음/지인이나 가족에게 사진을 보여주며 답을 기다림", "f:p_crit": "주형•견적비,거리,신뢰", "f:p_fear": "주형•돈을 알맞게 지불했는지 모르는 것", "f:e2": "엔진오일 교체하는 데 이 가격이 맞는 건가? 검색해 봐도 다 제각각이라 감이 안 오네.", "f:e3": "\"어려운 정비 용어 대신 내역을 풀어서 보여주니까 한눈에 들어오네\"", "f:e4": "\"빨리 결제하고 나가야 하는데, 리포트에 나온 질문을 정비사한테 지금 다 물어봐야 되나...\"", "f:e5": "\"지난번에 기록해 둔 덕분에 이번엔 바가지 걱정 없이 바로 맡기면 되겠네\"", "f:as_q": "초보 운전자는 1분 안에 읽을 수 있는 요약 카드와 질문 3개가 제공되면, 카운터 앞에서도 앱을 켜서 이를 적극 활용할 것이다", "f:as_how": "운전 경력 1년 미만의 초보 운전자 2명에게 MVP 요약 리포트 화면 보여주기 · 이번 주까지", "f:as_ok": "2명 중 2명이 \"실제 정비소 카운터 앞에서 충분히 꺼내서 볼 수 있겠다\"라고 답하면 → 맞다", "f:bmc_chg": "가치제안 — 초보 운전자가 정비소 카운터 앞에서 겪는 심리적 압박감을 즉각 해소해 주는 3초 안심 진단 및 소통 가이드 제공", "f:lw_why": "정비사가 지켜보는 카운터 앞에서 복잡한 정비 리포트를 읽고 대응해야 하는 상황이 주어져 심리적 압박감과 금전적 불안감이 극에 달하기 때문 [A: 가정·인터뷰 확인 필요]", "f:r_b": "OCR 인식 속도나 가독성이 현장 환경에 따라 변수가 있을 수 있어 즉각적인 확신보다는 이해도 향상(+1) 수준으로 보는 것이 타당함", "f:r_a": "앱을 켜서 사진을 올리면 즉시 해석되어 사용자가 완전한 확신과 함께 편안함을 느낌(+2)"}, "eux11": {"f:ia_diff": "1.\t견적서 사진 분석: 견적서를 찍어 올리면 부품·공임을 나눠 보여주고 모르는 용어를 풀어준다. 2. 정비소에 물어볼 질문 카드: 견적서 분석 결과를 보고 정비소에 바로 물어볼 질문 3개를 카드로 만들어 준다", "f:s1_n": "첫 화면", "f:s2_n": "내 차·상황 고르기", "f:s3_n": "요약 카드", "f:s4_n": "질문·결정", "f:s5_n": "끝 (영수증·다음 점검)", "f:u1": "화면1: 초보운전자 주형이가 차의 경고등을 보고 정비소에서 필요한 정비만 받으면 끝", "f:fn_prob": "2단계(따져 봄) → 3단계(첫 사용)에서 사진 업로드의 번거로움과 개인정보 노출에 대한 불안으로 고객이 이탈할 수 있으므로, 견적서를 쉽고 안심하고 등록할 수 있어야 한다.", "f:mv_v1": "아직 테스트 안함", "f:mv_hyp": "초보 운전자는 견적서 해석 결과 화면을 보면 결제 전 확인이 필요한 정비 항목을 선택하고, 정비소 직원에게 질문할 것이다.", "f:u6": "시스템:고객이 업로드한 정보를 저장,분류/ AI:고객별 필요 정비 및 요청사항을 견적서 바탕으로 분석 / 정비사(사람): 플랫폼에서 확인한 정보를 바탕으로 정비 준비", "f:u4": "화면1: OCR로 인해 견적의 비용을 예상하여 금액의 진정성을 보여준다.", "f:ts_next": "1. 화면 2 \"OCR 추출 부품 명칭\" -> \"초보자도 알기 쉬운 쉬운 용어와 한글 설명 추가\"\n2. 화면 4 \"반박 질문 리스트 버튼\" -> \"정비소 카운터 앞에서 바로 누르기 쉽도록 화면 상단으로 배치\"", "f:rp_title": "안심 진단 — 초보 운전자의 정비소 바가지 요금 불안과 카운터 앞 압박감을 3초 만에 해결하는 OCR 안심 견적 앱", "f:rp_s1": "차를 산 지 얼마 안 된 초보 운전자가 정비소 카운터 앞에서 전문 용어와 바가지 요금에 압도되어, 제대로 따지지 못하고 부당한 정비 비용을 그대로 결제하며 멈춤", "f:rp_s2": "화면 2에서 정비 명세서 사진을 찍으면, 화면 3·4에서 표준 정비 단가와 비교해 과잉 정비 여부를 3초 만에 분석하고 사장님께 반박할 질문 리스트를 보여주어 멈춤을 없앰", "f:rp_lim": "이걸 확인하려면 다음에 실제 정비를 앞둔 초보 운전자 3명에게 직접 앱을 쥐여주고 정비소 방문 전후의 심리 변화 테스트를 진행할 것"}, "emk12": {"tname": "5팀(won팀)", "segBy": "정비소 대처 능력 및 정보 탐색 성향", "pr": "견적서를 찍으면 OCR로 부품·공임 내역을 읽어 적정 시세와 과잉 정비 여부를 보여주고, 개인정보 마스킹·안심 등록 흐름과 함께 카운터에서 바로 쓸 수 있는 질문·대응 멘트 및 : "4", "s_b_1": "2", "s_b_2": "3", "s_b_3": "2", "s_b_4": "4", "s_u_5": "3", "s_b_5": "4", "ff_new_who": "생성형 AI 서비스", "ff_new_lv": "중", "ff_new_why": "같은 AI를 기반으로 하고 있어서 신규진입의 위험이 있음", "ff_sup_who": "정비소(제휴 · 가격 데이터 제공 거부 가능)", "ff_sup_lv": "강", "ff_sup_why": "정비소의 데이터 제공이 없으면 플랫폼 운영하기 힘듦", "ff_buy_who": "정비는 1년에 몇 번 — 자주 쓰지 않아 떠나기 쉬움", "ff_buy_lv": "약", "ff_buy_why": "자주 사용하지 않아도 좋은 서비스를 제공하면 고객을 유지할 수 있음"}}, "8팀": {"eb11": {"f:p_name": "이 사장님 | 여러 음식점을 혼자 운영하는 50대", "f:p_src": "인터뷰 / 반응 좋음(가정) / 리뷰에 신경을 써야한다는 의견이 많이 나오는 것을 커뮤니티에서 확인", "f:p_sit": "가게 영업이 끝난 밤 12시 이후 개인 시간을 사용하여 리뷰 답변을 작성. 리뷰가 밀릴수록 답변이 늦어지고 매장에 반영하기 곤란.", "f:p_goal": "일반 리뷰나 불만 리뷰를 대신 작성하는 것/리뷰를 직접 확인한 후 답변을 작성.", "f:p_crit": "리뷰 답변의 정확성, 작성 시간 , 매장별 말투와 일관성", "f:p_fear": "답변을 일일이 확인하여 수정해야 하는 상황(믿지 못하는 경우)", "f:st1": "당근 혹은 자체 커뮤니티에서 홍보, 후기글로 알게 됨", "f:st2": "일주일 무료체험으로 사용해봄, 생성형 AI의 답변 품질과 편의성 비교", "f:st3": "리뷰글 연동 -  AI 답변 초안 생성, 리뷰 내용의 핵심 분석", "f:st4": "답변 작성에서 시간과 노력이 줄고, 매장에 맞는 답변을 편리하게 작성해준다고 느낀 것이 매장의 관리, 매출로 연결", "f:st5": "AI가 대신 답변하는 기능이 편리하면 다시쓰기, 무료 AI와 차이가 없거나 구독료가 부담되면 사용을 중단", "f:e1": "\"AI가 나 대신 리뷰글에 답변해준다고?\"", "f:e2": "\"기존 무료 AI보다 답변을 더 잘 써줄까? 매장 상황에 맞게 수정 없이 사용할 수 있을까?\"", "f:e4": "\"리뷰 답변 작성 시간이 줄고 편리해지긴 했는데, 매달 구독료를 내는 건 생각 해봐야할 것 같은데?\"", "f:e3": "\"on/off 기능이 있어 내가 초안을 확인할 수 있고, 바로 답변을 달 수 있게도 해놨네. 근데 초안을 확인하지 않으면 약간 불안해.\"", "f:e5": "\"급한 리뷰를 놓치지 않고 답변할 수 있어서 편하네. 그런데 무료 AI보다 확실히 좋은 점이 있어야 계속 돈을 내지.\"", "f:lw_why": "피클 방식은 고객의 배달앱 아이디와 비밀번호를 받아 우리가 대신 리뷰에 답변을 게시하는 구조다. 가입 후 계정 정보를 입력하라는 요구를 받으면 맡겨도 되나 라는 불안이 생길 수 있다. 또 자동 답변이 바로 게시된다고 한다면, 고객의 생각과 다른 답변이 달릴 수 있어 불안이 커진다.", "f:r_a": "첫 사용을 +0로 의견 냄. 재사용에서 급한 리뷰 알림과 주간 분석으로 사장님이 지속적으로 서비스를 이용한다고 가정 설정.", "f:r_b": "첫 사용에서 호기심이나 관심을 가질 수 있으므로 +2로 바꿈. 급한 리뷰 알림 내용은 반영, 주간 분석은 내용 수정하여 반영함.", "f:bmc_chg": "초안 옆에는 왜 이러한 답변을 쓴 이유를 적는다.", "f:as_q": "고객은 이 답변을 쓴 이유를 보여주면, 이유와 답변 초안을 다시 확인해 답변을 다는 것에 시간이 늘게 된다.", "f:as_how": "답변을 직접 쓰는 사장님에게 답변 초안과 이 답변을 쓴 이유를 알려주는 기능을 보여준다. 11/16까지", "f:as_ok": "2명 1명이 맞으면 활용하겠다."}, "eux11": {"f:mv_v1": "아직 테스트 안 함", "f:ia_diff": "매장별 말투 초안 -- 가게마다 다른 말투를 기억해 초안을 쓰는 기능, 리뷰 분석 기능 -- 고객 반응과 주요 내용을 분석해 매장 운영에 방향에 도움을 줌.", "f:mv_hyp": "가게가 많이 바쁜 사장님에게 자동 리뷰 답글 작성중인 화면을 보여주면 추천 문구를 확인하지 않고 사용할 것이다", "f:s1_n": "첫 화면", "f:s2_n": "우리 가게 맞추기", "f:s3_n": "급한 리뷰 + 초안", "f:s4_n": "승인 · 구독", "f:s5_n": "끝 (아침 리포트)", "f:fn_prob": "무료 체험이 끝난 직후 고객이 빠져나갈 것이다. 우리는 고객이 빠져나가지 않도록 무료체험에서 매장 관리도 도와주는 등급의 월정액을 무료체험으로 내 처음부터 고객의 마음을 사로잡을 것이다.", "f:u1": "이 사장님은 아침에 리뷰 알림으로 들어와, 급한 리뷰와 답변 초안을 확인하고 승인하면 끝.", "f:u6": "시스템: 소비자 리뷰 자동 수집 및 저장, 답변 처리 상태 관리, 매일 알림과 주간 리포트 전달\nAI: 리뷰 내용 분석, 카테고리 별 리뷰 분류, 매장별 특징을 반영한 답변 초안 작성, 반복되는 불만 요약 및 매장 운영 분석 보고서 생성\n사람: 매니저가 답변 초안 확인하고 답변 옮기기(결제는 사장님이), AI가 제공한 리뷰 분석 보고서 검토", "f:u4": "리뷰 문구를 추천하지만 사장님이 승인 후 게시할지,자동으로 답변 게시할지 선택 화면", "f:rp_title": "리뷰메이트 - 음식점 사장님의 리뷰 관리 부담 줄이기", "f:rp_lim": "실제 자영업 사장님들에게 태스트를 하지 않음", "f:rp_s1": "리뷰에 따라 답변해야할 내용과 성격이 다르고 그 내용을 파악하고 답변을 작성하는 데 시간이 걸려 리뷰 대응을 미루게 된다.", "f:rp_s2": "급한 리뷰 화면: 별점 1~2점부터 차례로 정, 가게 말투 답장 초안 + \"승인\" 버튼, 보고서 확인 버튼"}, "emk12": {"tname": "8팀", "segBy": "가게 수, 리뷰량", "fn_b0": "공유 링크나,APP 스토어로 다운로드 하여 들어온다.", "pr": "급한 리뷰를 우선 정리하고, 가게 말투에 맞는 답변을 제공해줌. 주간 리뷰 분석을 통해 매장 관리에 필요한 고객 반응과 주요 불만도 확인할 수 있음.", "seg0": "혼자 여러 가게를 운영하고 리뷰가 많아 부담이 큰 50대 사장님", "seg1": "가게 1곳을 운영하지만 리뷰가 많아 답변 작성에 부담을 느끼는 20대 사장님", "seg2": "여러 가게를 운영하지만 리뷰량이 적어 답변 관리보다 매장 운영 개선에 관심이 큰 30대 사장님", "tgt": "혼자 여러 가게를 운영하고 리뷰가 많아 부담이 큰 50대 사장님", "tgt_why": "불편이 크다: 여러 가게의 리뷰를 혼자 확인하고 답변해야 하므로 관리에 많은 시간과 노력이 든다. 또한 가게마다 다른 고객 불만과 요구를 파악하고 답변하기도 어렵다. [가정], 접근하기 쉽다: 토더의 경우 커뮤니티나 광고를 통해서 유입되는 사장님들이 많았던 것으로 확인함.", "p_c": "AI 기반 리뷰 관리 서비스", "p_alt": "무료 AI 채팅에 리뷰를 하나씩 붙여 넣거나, 직접 리뷰를 확인하고 시간과 정성을 들여 답변을 작성함.", "p_d": "여러 매장의 급한 리뷰를 한곳에서 우선순위별로 관리해주며, 리뷰를 지속적으로 모아 매장별 반복 불만, 고객 반응 등을 정리한 보고서를 정기적으로 제공.", "p_cmp": "ChatGPT", "p_cn": "급한 리뷰 먼저, 답글은 승인만.", "k_in_f": "「답변 품질을 보고 마음에 들면 결제한다.」까지 온 사람 ÷ 「공유 링크나,APP 스토어로 다운로드 하여 들어온다.」까지 온 사람", "k_cv_f": "「답변 초안이나 리뷰 내용 답변 어투를 직접 수정해서 개선한다」까지 온 사람 ÷ 「답변 품질을 보고 마음에 들면 결제한다.」까지 온 사람", "k_re_f": "「편리하면 계속 사용하
